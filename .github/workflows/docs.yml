name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**, package.json, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate markdown files
        run: npm run validate
      - name: Export static site
        run: npm run export
      - name: Verify export output
        run: |
          ls -la docs/_html/public
          test -f docs/_html/public/index.html || { echo "Error: index.html not found"; exit 1; }
          touch docs/_html/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_html/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
